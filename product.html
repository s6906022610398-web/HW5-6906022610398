<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AURA - Products</title>
    <link rel="stylesheet" href="css/gridstyle.css">
</head>
<body>
<header>
    <div class="header-box">
        <img src="images/header.jpg">
    </div>
</header>
<nav class="top-menu">
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
    </ul>
</nav>

<div class="container">
    <div class="main-content">
        <div class="card">
            <h1>Our Catalog</h1>
            <h2>Browse products and details below.</h2>
            <img src="images/product1.jpg"> 
        </div>

        <div class="card">
            <h1>Product Name</h1>
            <h2>Short description, price, and actions (add to cart, view details).</h2>
            <img src="images/product2.jpg"> 
        </div>
    </div>

    <div class="sidebar">
        <h2>สมัครสมาชิก</h2>
        <form action="#" method="POST">
            <label>ชื่อ</label>
            <input type="text" placeholder="ชื่อจริง">

            <label>นามสกุล</label>
            <input type="text" placeholder="นามสกุล">

            <label>อีเมล</label>
            <input type="email" placeholder="example@gmail.com">

            <label>รหัสผ่าน</label>
            <input type="password" placeholder="อย่างน้อย 8 ตัวอักษร">

            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" placeholder="ยืนยันรหัสผ่าน">

            <label>เบอร์โทรศัพท์</label>
            <input type="tel" placeholder="099-xxx-xxxx">

            <label>เพศ</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male"> ชาย</label>
                <label><input type="radio" name="gender" value="female"> หญิง</label>
                <label><input type="radio" name="gender" value="other"> ไม่ระบุ</label>
            </div>

            <div class="checkbox-group">
                <label><input type="checkbox"> รับข่าวสาร</label>
                <label><input type="checkbox"> โปรโมชั่น</label>
                <label><input type="checkbox"> กิจกรรม</label>
            </div>

            <label>ประเภทสมาชิก</label>
            <select>
                <option value="Normal">Normal</option>
                <option value="VIP">VIP</option>
                <option value="Premium">Premium</option>
            </select>

            <div class="terms">
                <label><input type="checkbox"> ยอมรับข้อกำหนดและเงื่อนไข</label>
            </div>

            <button type="submit">สมัครสมาชิก</button>
            <p class="note">เราจะเก็บข้อมูลของคุณเป็นความลับ</p>
        </form>
    </div>

</div>

<footer>
    <div class="footer-box">
        <img src="images/footer.jpg">
    </div>
</footer>
</body>
</html>
